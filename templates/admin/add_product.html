{% extends "base.html" %}
{% block content %}
<div class="admin-wrapper">
    <h2>Add Product</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Price (₦)</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Images (select one or more — the first becomes the cover photo)</label>
            <input type="file" name="images" class="form-control" accept="image/*" multiple>
        </div>
        <button class="btn" style="background:var(--primary); color:white; border:none; border-radius:30px; padding:0.6rem 2rem;">Add Product</button>
    </form>
</div>
{% endblock %}
